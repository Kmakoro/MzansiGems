name: Mzansi Gem CI

on:
  push:
    branches: [ main ]
    paths:
      - "HiddenGemsApp/**"
      - "website/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "HiddenGemsApp/**"
      - "website/**"
      - ".github/workflows/android-ci.yml"

jobs:
  android-test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HiddenGemsApp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mzansi-gem-debug-apk
          path: HiddenGemsApp/app/build/outputs/apk/debug/app-debug.apk

  php-and-database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, curl, mbstring
          coverage: none

      - name: Check PHP syntax
        run: |
          find website -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Create and seed test database
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot < website/database/install.sql

      - name: Verify required database records
        env:
          MYSQL_PWD: root
        shell: bash
        run: |
          set -euo pipefail
          tables=(
            users
            email_verification_tokens
            remember_tokens
            api_tokens
            password_resets
            gems
            gem_images
            reviews
            saved_gems
            gem_likes
            review_likes
            reports
            settings
            activity_log
          )

          for table in "${tables[@]}"; do
            count=$(mysql -h 127.0.0.1 -P 3306 -uroot -Nse "SELECT COUNT(*) FROM hidden_gems.${table};")
            echo "${table}: ${count} records"
            if [ "${count}" -lt 10 ]; then
              echo "::error::${table} has only ${count} records; Task 2 requires at least 10."
              exit 1
            fi
          done

      - name: Verify website and Android API use same database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: hidden_gems
          DB_USER: root
          DB_PASS: root
          APP_ENV: development
          APP_URL: http://127.0.0.1:8080
          TEST_API_URL: http://127.0.0.1:8080/api/v1
        run: |
          php -S 127.0.0.1:8080 -t website website/tests/ci-router.php > /tmp/mzansi-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          php website/tests/shared_database_integration.php

      - name: Verify Firebase identity column
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -Nse             "SELECT COLUMN_NAME FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='hidden_gems' AND TABLE_NAME='users' AND COLUMN_NAME='firebase_uid';"             | grep -qx firebase_uid
