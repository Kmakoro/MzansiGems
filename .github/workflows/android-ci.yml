name: Mzansi Gem CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "HiddenGemsApp/**"
      - "website/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "HiddenGemsApp/**"
      - "website/**"
      - ".github/workflows/android-ci.yml"

jobs:
  android-test-and-build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    defaults:
      run:
        working-directory: HiddenGemsApp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore the Firebase-registered debug signing certificate
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is missing. Firebase-ready APK cannot be produced."
            exit 1
          else
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            ACTUAL_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | awk -F': ' '/SHA1:/{print $2; exit}' | tr '[:lower:]' '[:upper:]')"
            EXPECTED_SHA1="54:F7:E0:91:47:58:AF:69:8A:A1:55:8C:6A:AE:C0:F1:9F:C4:FE:F7"
            if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
              echo "::error::The signing key does not match the SHA-1 registered for MzansiGems Android in Firebase."
              exit 1
            fi
            echo "Firebase debug signing SHA-1 verified."
          fi

      - name: Check Firebase configuration
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$FIREBASE_API_KEY" ] || [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::Firebase credentials are incomplete. Set all four Firebase GitHub Actions secrets."
            exit 1
          else
            echo "Firebase Android configuration supplied."
          fi
          if [ "$FIREBASE_PROJECT_ID" != "mzansigems" ]; then
            echo "::error::FIREBASE_PROJECT_ID does not match the Firebase project."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mzansi-gem-debug-apk
          path: HiddenGemsApp/app/build/outputs/apk/debug/app-debug.apk

      # This optional second artifact is usable from any phone/network once a
      # publicly reachable HTTPS PHP API is deployed and PUBLIC_API_BASE_URL is set.
      # Localhost / 10.0.2.2 debug builds must never be labelled as phone-ready.
      - name: Validate public HTTPS API for phone APK
        if: ${{ github.event_name != 'pull_request' && vars.PUBLIC_API_BASE_URL != '' }}
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail
          case "$PUBLIC_API_BASE_URL" in
            https://*/api/v1/) ;;
            *) echo "::error::PUBLIC_API_BASE_URL must be an HTTPS URL ending in /api/v1/"; exit 1 ;;
          esac
          host="$(printf '%s' "$PUBLIC_API_BASE_URL" | sed -E 's@^https://([^/:]+).*@\1@')"
          case "$host" in
            localhost|127.*|10.*|192.168.*|169.254.*|172.16.*|172.17.*|172.18.*|172.19.*|172.2?.*|172.30.*|172.31.*|*.local)
              echo "::error::The Android phone APK needs a publicly reachable HTTPS API, not a LAN/emulator address."
              exit 1
              ;;
          esac
          curl --fail --silent --show-error --location --max-time 25 "${PUBLIC_API_BASE_URL}health" > /tmp/mzansi-phone-api-health.json
          python3 -c 'import json; x=json.load(open("/tmp/mzansi-phone-api-health.json")); assert x.get("success") is True and x.get("data", {}).get("status") == "healthy", "Public API health endpoint failed"'
          echo "Public HTTPS PHP API health check passed."

      - name: Build Android APK for phones anywhere
        if: ${{ github.event_name != 'pull_request' && vars.PUBLIC_API_BASE_URL != '' }}
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: ./gradlew assembleDebug -PAPI_BASE_URL="$PUBLIC_API_BASE_URL" --no-daemon

      - name: Upload phone-ready APK
        if: ${{ github.event_name != 'pull_request' && vars.PUBLIC_API_BASE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mzansi-gem-anywhere-apk
          path: HiddenGemsApp/app/build/outputs/apk/debug/app-debug.apk

  php-and-database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, curl, mbstring
          coverage: none

      - name: Check PHP syntax
        run: |
          find website -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Create and seed test database
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot < website/database/install.sql

      - name: Check PHP database table presence without changing data
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: hidden_gems
          DB_USER: root
          DB_PASS: root
        run: php website/scripts/check_database.php

      - name: Verify required database records
        env:
          MYSQL_PWD: root
        shell: bash
        run: |
          set -euo pipefail
          tables=(
            users
            email_verification_tokens
            remember_tokens
            api_tokens
            password_resets
            gems
            gem_images
            reviews
            saved_gems
            gem_likes
            review_likes
            reports
            settings
            activity_log
          )

          for table in "${tables[@]}"; do
            count=$(mysql -h 127.0.0.1 -P 3306 -uroot -Nse "SELECT COUNT(*) FROM hidden_gems.${table};")
            echo "${table}: ${count} records"
            if [ "${count}" -lt 10 ]; then
              echo "::error::${table} has only ${count} records; Task 2 requires at least 10."
              exit 1
            fi
          done

      - name: Verify website and Android API use same database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: hidden_gems
          DB_USER: root
          DB_PASS: root
          APP_ENV: development
          APP_URL: http://127.0.0.1:8080
          TEST_API_URL: http://127.0.0.1:8080/api/v1
        run: |
          php -S 127.0.0.1:8080 -t website website/tests/ci-router.php > /tmp/mzansi-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          php website/tests/shared_database_integration.php

      - name: Verify Firebase identity column
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -Nse             "SELECT COLUMN_NAME FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='hidden_gems' AND TABLE_NAME='users' AND COLUMN_NAME='firebase_uid';"             | grep -qx firebase_uid
